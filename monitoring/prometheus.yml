# Prometheus configuration for Knotty DSL monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Knotty development service
  - job_name: 'knotty-dev'
    static_configs:
      - targets: ['knotty-dev:8080']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scheme: 'http'

  # PostgreSQL (if using database profile)
  - job_name: 'postgres'
    static_configs:
      - targets: ['pattern-db:5432']
    scrape_interval: 30s

  # Redis (if using cache profile)
  - job_name: 'redis'
    static_configs:
      - targets: ['pattern-cache:6379']
    scrape_interval: 30s

# Optional: Configure alerting
