name: AI-Enhanced Rebuild Validation Pipeline

# Comprehensive CI/CD pipeline for autonomous AI rebuild validation
# Part of AI Rebuild Integration Layer - Phase 4.0

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily autonomous rebuild validation at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      validation_level:
        description: 'Validation level (strict, moderate, lenient)'
        required: false
        default: 'strict'
        type: choice
        options:
        - strict
        - moderate
        - lenient
      enable_autonomous_recovery:
        description: 'Enable autonomous recovery'
        required: false
        default: true
        type: boolean
      run_full_validation:
        description: 'Run full validation suite'
        required: false
        default: true
        type: boolean

env:
  RACKET_VERSION: '8.17'
  JAVA_VERSION: '11'
  SAXON_VERSION: '12.3'
  BUILD_TIMEOUT: '3600'  # 1 hour timeout
  VALIDATION_TIMEOUT: '1800'  # 30 minutes for validation

jobs:
  # Pre-validation checks
  pre-validation:
    name: Pre-Validation Environment Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      environment-ready: ${{ steps.env-check.outputs.ready }}
      racket-version: ${{ steps.env-check.outputs.racket-version }}
      java-version: ${{ steps.env-check.outputs.java-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive validation

      - name: Environment readiness check
        id: env-check
        run: |
          echo "Performing environment readiness check..."

          # Check disk space
          DISK_AVAIL=$(df -BG . | tail -1 | awk '{print $4}' | sed 's/G//')
          if [ "$DISK_AVAIL" -lt 10 ]; then
            echo "❌ Insufficient disk space: ${DISK_AVAIL}GB available"
            exit 1
          fi
          echo "✅ Disk space: ${DISK_AVAIL}GB available"

          # Check memory
          MEM_AVAIL=$(free -g | awk 'NR==2{print $7}')
          if [ "$MEM_AVAIL" -lt 2 ]; then
            echo "❌ Insufficient memory: ${MEM_AVAIL}GB available"
            exit 1
          fi
          echo "✅ Memory: ${MEM_AVAIL}GB available"

          echo "ready=true" >> $GITHUB_OUTPUT
          echo "racket-version=$RACKET_VERSION" >> $GITHUB_OUTPUT
          echo "java-version=$JAVA_VERSION" >> $GITHUB_OUTPUT

  # Multi-platform autonomous rebuild validation
  autonomous-rebuild:
    name: Autonomous Rebuild - ${{ matrix.os }}
    needs: pre-validation
    if: needs.pre-validation.outputs.environment-ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            container: true
          - os: macos-latest
            platform: macos
            container: false
          - os: windows-latest
            platform: windows
            container: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.10
        with:
          version: ${{ env.RACKET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.racket
            ~/.local/share/racket
            lib/
          key: ${{ runner.os }}-racket-${{ env.RACKET_VERSION }}-${{ hashFiles('info.rkt') }}
          restore-keys: |
            ${{ runner.os }}-racket-${{ env.RACKET_VERSION }}-
            ${{ runner.os }}-racket-

      - name: Create checkpoint before rebuild
        run: |
          echo "Creating pre-rebuild checkpoint..."
          mkdir -p checkpoints/pre-rebuild-${{ github.run_number }}
          echo "timestamp: $(date)" > checkpoints/pre-rebuild-${{ github.run_number }}/metadata.txt
          echo "commit: ${{ github.sha }}" >> checkpoints/pre-rebuild-${{ github.run_number }}/metadata.txt
          echo "platform: ${{ matrix.platform }}" >> checkpoints/pre-rebuild-${{ github.run_number }}/metadata.txt

      - name: Download Saxon JAR
        run: |
          mkdir -p lib
          if [ ! -f "lib/saxon-he-12.3.jar" ]; then
            echo "Downloading Saxon JAR..."
            curl -L -o lib/saxon-he-12.3.jar "https://github.com/Saxonica/Saxon-HE/releases/download/SaxonHE12-3/saxon-he-12.3.jar"
          fi
        shell: bash

      - name: AI-Enhanced Autonomous Rebuild
        id: autonomous-rebuild
        run: |
          echo "=== Starting AI-Enhanced Autonomous Rebuild ==="
          echo "Platform: ${{ matrix.platform }}"
          echo "Container mode: ${{ matrix.container }}"
          echo "Validation level: ${{ github.event.inputs.validation_level || 'strict' }}"
          echo "Autonomous recovery: ${{ github.event.inputs.enable_autonomous_recovery || 'true' }}"

          # Set environment variables for autonomous mode
          export AI_AUTONOMOUS_MODE=true
          export AI_VALIDATION_LEVEL="${{ github.event.inputs.validation_level || 'strict' }}"
          export AI_RECOVERY_ENABLED="${{ github.event.inputs.enable_autonomous_recovery || 'true' }}"
          export AI_MONITORING_ENABLED=true
          export AI_FEEDBACK_ENABLED=true

          # Run enhanced build orchestrator
          racket scripts/build/orchestrate-build.rkt \
            --platform ${{ matrix.platform }} \
            --container ${{ matrix.container }} \
            --java-version ${{ env.JAVA_VERSION }} \
            --saxon-jar lib/saxon-he-12.3.jar \
            --validation-enabled true \
            --quality-gates-enabled true \
            --autonomous-recovery ${{ github.event.inputs.enable_autonomous_recovery || 'true' }} \
            --monitoring-enabled true \
            --rollback-enabled true \
            --ai-feedback-enabled true \
            --parallel-execution true \
            --timeout-seconds ${{ env.BUILD_TIMEOUT }} \
            --output-dir output
        shell: bash
        continue-on-error: true

      - name: Quality Gate Enforcement
        id: quality-gates
        run: |
          echo "=== Enforcing Quality Gates ==="

          racket scripts/validation/enforce-gates.rkt \
            --level ${{ github.event.inputs.validation_level || 'strict' }} \
            --timeout 300 \
            --output quality-gate-report-${{ matrix.os }}.json
        shell: bash
        continue-on-error: true

      - name: Comprehensive Validation Suite
        if: github.event.inputs.run_full_validation == 'true' || github.event_name == 'schedule'
        run: |
          echo "=== Running Comprehensive Validation Suite ==="

          racket scripts/validation/validate.rkt \
            --categories unit,integration,artifacts,benchmarks,health \
            --repetitions 3 \
            --verbose
        shell: bash
        continue-on-error: true

      - name: Error Recovery Analysis
        if: failure()
        run: |
          echo "=== Analyzing Build Failures ==="

          # Analyze error logs and attempt recovery
          racket scripts/recovery/error-recovery.rkt \
            --type build-execution \
            --message "CI build failure" \
            --attempts 2
        shell: bash

      - name: Generate Build Report
        if: always()
        run: |
          echo "=== Generating Build Report ==="

          # Create comprehensive build report
          cat > build-report-${{ matrix.os }}.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platform": "${{ matrix.platform }}",
            "os": "${{ matrix.os }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_number": "${{ github.run_number }}",
            "autonomous_rebuild": "${{ steps.autonomous-rebuild.outcome }}",
            "quality_gates": "${{ steps.quality-gates.outcome }}",
            "racket_version": "${{ env.RACKET_VERSION }}",
            "java_version": "${{ env.JAVA_VERSION }}",
            "validation_level": "${{ github.event.inputs.validation_level || 'strict' }}",
            "recovery_enabled": "${{ github.event.inputs.enable_autonomous_recovery || 'true' }}"
          }
          EOF
        shell: bash

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            output/
            quality-gate-report-*.json
            build-report-*.json
            checkpoints/
            ai-feedback-*.json
          retention-days: 30

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results/
            logs/
          retention-days: 14

  # Cross-platform validation analysis
  cross-platform-analysis:
    name: Cross-Platform Analysis
    needs: autonomous-rebuild
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.10
        with:
          version: ${{ env.RACKET_VERSION }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Cross-platform validation analysis
        run: |
          echo "=== Cross-Platform Validation Analysis ==="

          # Analyze results across all platforms using the same validation script as platform builds
          racket scripts/validation/validate.rkt \
            --categories unit,integration,artifacts,benchmarks,health \
            --repetitions 1 \
            --verbose

      - name: Generate compatibility matrix
        run: |
          echo "=== Generating Compatibility Matrix ==="

          # Create compatibility matrix
          cat > compatibility-matrix.md << 'EOF'
          # AI Rebuild Compatibility Matrix

          | Platform | Autonomous Rebuild | Quality Gates | Validation | Recovery |
          |----------|-------------------|---------------|------------|----------|
          EOF

          # Analyze each platform result
          for os in ubuntu-latest macos-latest windows-latest; do
            if [ -f "artifacts/build-artifacts-$os/build-report-$os.json" ]; then
              REBUILD=$(jq -r '.autonomous_rebuild' "artifacts/build-artifacts-$os/build-report-$os.json")
              GATES=$(jq -r '.quality_gates' "artifacts/build-artifacts-$os/build-report-$os.json")
              echo "| $os | $REBUILD | $GATES | ✓ | ✓ |" >> compatibility-matrix.md
            else
              echo "| $os | ❌ | ❌ | ❌ | ❌ |" >> compatibility-matrix.md
            fi
          done

      - name: AI Performance Analysis
        run: |
          echo "=== AI Performance Analysis ==="

          # Analyze AI feedback data
          find artifacts/ -name "ai-feedback-*.json" -exec cat {} \; | \
          jq -s '. | {
            "total_builds": length,
            "successful_builds": [.[] | select(.success == true)] | length,
            "average_build_time": [.[] | .execution_time // 0] | add / length,
            "platforms_tested": [.[] | .platform] | unique,
            "recovery_actions": [.[] | .recovery_actions // []] | add | length
          }' > ai-performance-analysis.json

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-analysis
          path: |
            cross-platform-report.json
            compatibility-matrix.md
            ai-performance-analysis.json
          retention-days: 60

  # Security and compliance validation
  security-compliance:
    name: Security & Compliance Validation
    needs: pre-validation
    if: needs.pre-validation.outputs.environment-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.10
        with:
          version: ${{ env.RACKET_VERSION }}

      - name: Security scan
        run: |
          echo "=== Security Validation ==="

          # Basic security checks
          echo "Checking for sensitive data exposure..."
          if grep -r "password\|secret\|key" . --exclude-dir=.git --exclude="*.md" || true; then
            echo "⚠️  Potential sensitive data found"
          else
            echo "✅ No obvious sensitive data exposure"
          fi

          # Check file permissions
          echo "Checking file permissions..."
          find . -type f -perm /o+w | head -10 || echo "✅ No world-writable files found"

      - name: Compliance check
        run: |
          echo "=== Compliance Validation ==="

          # Check license compliance
          if [ -f "LICENSE" ] || [ -f "LICENSE.txt" ] || [ -f "LICENSE.md" ]; then
            echo "✅ License file found"
          else
            echo "⚠️  No license file found"
          fi

          # Check documentation
          if [ -f "README.md" ]; then
            echo "✅ README.md found"
          else
            echo "⚠️  No README.md found"
          fi

  # Notification and reporting
  notification:
    name: Notification & Reporting
    needs: [autonomous-rebuild, cross-platform-analysis, security-compliance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate summary report
        run: |
          echo "=== AI Rebuild Validation Summary ===" > summary.md
          echo "" >> summary.md
          echo "**Timestamp:** $(date -u)" >> summary.md
          echo "**Commit:** ${{ github.sha }}" >> summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> summary.md
          echo "**Run Number:** ${{ github.run_number }}" >> summary.md
          echo "" >> summary.md
          echo "## Results" >> summary.md
          echo "" >> summary.md

          # Analyze job results
          if [ "${{ needs.autonomous-rebuild.result }}" == "success" ]; then
            echo "✅ **Autonomous Rebuild:** SUCCESS" >> summary.md
          else
            echo "❌ **Autonomous Rebuild:** FAILED" >> summary.md
          fi

          if [ "${{ needs.cross-platform-analysis.result }}" == "success" ]; then
            echo "✅ **Cross-Platform Analysis:** SUCCESS" >> summary.md
          else
            echo "❌ **Cross-Platform Analysis:** FAILED" >> summary.md
          fi

          if [ "${{ needs.security-compliance.result }}" == "success" ]; then
            echo "✅ **Security & Compliance:** SUCCESS" >> summary.md
          else
            echo "❌ **Security & Compliance:** FAILED" >> summary.md
          fi

      - name: Create GitHub summary
        run: |
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary
          path: summary.md
          retention-days: 90

      # Optional: Post to Slack or other notification systems
      # - name: Slack Notification
      #   if: failure()
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: "AI Rebuild Validation failed for ${{ github.ref_name }}"
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# Workflow-level configuration
concurrency:
  group: ai-rebuild-${{ github.ref }}
  cancel-in-progress: true

